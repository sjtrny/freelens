services:
  evaluation-viewer:
    image: freelens-evaluation-viewer:local
    build:
      context: .
      dockerfile: Dockerfile.viewer
    init: true
    read_only: true
    user: "${VIEWER_UID:-1000}:${VIEWER_GID:-1000}"
    volumes:
      - ${VIEWER_DATASET_PATH:-./dataset}:/app/dataset
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - 8899:8899

services:
  tag-editor:
    image: freelens-tag-editor:local
    build:
      context: .
      dockerfile: Dockerfile.tag-editor
    init: true
    read_only: true
    user: "${TAG_EDITOR_UID:-1000}:${TAG_EDITOR_GID:-1000}"
    volumes:
      - ${TAG_EDITOR_DATASET_PATH:-./dataset}:/app/dataset
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - 8899:8899

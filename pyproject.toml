[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "freelens"
version = "0.0.2"
requires-python = ">=3.11"
description = "Reference implementation of NaviLens and ddTag"
authors = [{name = "Stephen Tierney", email = "sjtrny@gmail.com"}]
readme = "README.md"
dependencies = [
    "crc==7.1.0",
    "numpy==2.4.6",
    "opencv-python==4.14.0.94",
    "Pillow==12.3.0",
]

[project.optional-dependencies]
test = [
    "black==24.10.0",
    "isort==5.13.2",
    "pytest>=8",
]
dataset = [
    "PyMuPDF>=1.24,<2",
]

[project.urls]
Home = "https://github.com/sjtrny/freelens"

[tool.flit.sdist]
exclude = [
    "examples/",
    "dataset/",
    "requirements*",
    "setup.sh"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require the NaviLens-provided LFS corpus",
]

[tool.isort]
profile = "black"
